name: Query nhap 3-8
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Ngay nhap (YYYY-MM-DD)"
        default: "2026-08-03"
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run query
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_APP_TOKEN: ${{ secrets.LARK_APP_TOKEN }}
          QUERY_DATE: ${{ github.event.inputs.date }}
        run: python query_nhap_3-8.py
