name: sync-muahang-to-sheet
on:
  schedule:
    - cron: '0 1 * * *'      # 01:00 UTC = 08:00 sáng (giờ VN) mỗi ngày
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Chạy thử: chỉ đọc Base, KHÔNG ghi Sheet'
        type: boolean
        default: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Mirror Base view -> Lark Sheet
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_APP_TOKEN: ${{ secrets.LARK_APP_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python sync_muahang_to_sheet.py
