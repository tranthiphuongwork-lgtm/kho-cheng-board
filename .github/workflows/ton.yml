name: Doi chieu ton kho Gobox - Lark (hang ngay)
on:
  schedule:
    - cron: '0 23 * * *'   # 23:00 UTC = 06:00 sang gio VN (Actions thuong tre 3-8h)
  workflow_dispatch:
    inputs:
      min_lech:
        description: 'Bo qua chenh lech nho hon so nay'
        default: '50'
      dry_run:
        description: 'De 1 neu chi muon xem log, khong gui Lark'
        default: ''
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Doi chieu ton kho
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_APP_TOKEN: ${{ secrets.LARK_APP_TOKEN }}
          GOBOX_CLIENT_ID: ${{ secrets.GOBOX_CLIENT_ID }}
          GOBOX_CLIENT_SECRET: ${{ secrets.GOBOX_CLIENT_SECRET }}
          MIN_LECH: ${{ github.event.inputs.min_lech || '50' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python check_ton.py
      - name: Dua trang len GitHub Pages
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ton_lech.html
          git commit -m "Cap nhat doi chieu ton kho" || echo "khong co thay doi"
          git push
