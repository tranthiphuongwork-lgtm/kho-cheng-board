name: monthly-report
on:
  schedule:
    # 01:00 UTC ngày 1 hàng tháng = 08:00 sáng ngày 1 (giờ VN)
    - cron: '0 1 1 * *'
  workflow_dispatch:        # bấm chạy tay để test
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tao bao cao thang
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_APP_TOKEN: ${{ secrets.LARK_APP_TOKEN }}
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
          REPORT_PERIOD: month
        run: python weekly_report.py
      - name: Commit monthly_report.html
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add monthly_report.html
          git commit -m "Cap nhat bao cao thang" || echo "khong co thay doi"
          git push
